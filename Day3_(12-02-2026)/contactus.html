<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>TalentLyncAI</title>
        <style>
            body{
                font-family:Arial, Helvetica, sans-serif;
                background-color: #d6a2a2e6;
                margin: 0;
                padding: 0;
            }
            img {
                width: 100%;
                height: auto;
            }
        </style>
    </head>
    <body>
        <header style="background-color: #f2f2f2; padding: 20px; border: 1px solid #060606;">
            <div style="width: 100%;">
                <div style="text-align: center;">
                    <h1 style="margin:0;">TalentLyncAI</h1>
                </div>
                <nav style="gap: 20px;display: flex; justify-content: center;">
                    <a href="index.html">Home</a>
                    <a href="packages.html">Packages</a>
                    <a href="contactus.html">Contact Us</a>
                </nav><br/><br/>
            </div>
        </header>
        <div style="display:flex">
        <section style="max-width: 800px; margin:30px auto; padding: 20px; background-color: #f2f2f2; border: 1px solid #060606;">
            <div style="align-items: center;">
                <h3>Contact Us</h3>
                <form id="contactForm" name="contactForm" action="https://platinitee.com/talentlync/form.php" method="post">
                    <label>Username:</label>
                    <input type="text" id="username" name="Username" placeholder="Enter your username" minlength="3" maxlength="40" required><br/>
                    <br/>
                    <label>Email:</label>
                    <input type="email" id="Email" name="Email" placeholder="Enter your email" required><br/>
                    <br/>
                    <label>Age:</label>
                    <input type="number" id="age" name="Age" placeholder="Age" min="18" max="25" required><br/>
                    <br/>
                    <label>Date of Birth:</label>
                    <input type="date" id="dob" name="DOB" placeholder="Enter your Date of Birth" accept="previous" required><br/>
                    <br/>
                    <input type="submit" value="Submit">
                </form>
                <p>For any technical queries, please contact our support team at <a href="mailto:support@talentlync.com">support@talentlync.com</a></p>
            </div>
        </section>
        <div style="max-width: 400px; margin: 30px auto; padding: 20px; background-color: #f2f2f2; border: 1px solid #060606;">
            <aside class="sidebar">
                <h3>Subscribe to one of our packages</h3>
                <form action="submit" id="sub" name="sub" method="post">
                    <label>Name:</label>
                    <input type="text" id="Name" name="Name" placeholder="Enter your name" required><br/><br/>
                    <label>Email:</label>
                    <input type="email" id="Email" name="Email" placeholder="Enter your email" required><br/><br/>
                    <label>Package:</label>
                    <select id="Package" name="Package" required>
                        <option value="">Select a package</option>
                        <option value="BasicBot">Basic AI Chatbot</option>
                        <option value="EnterpriseBotWebsite">Enterprise AI Chatbot Integrated Website</option>
                        <option value="BasicVoiceAgent">Basic AI Voice Agent</option>
                        <option value="EnterpriseVoiceAgent">Enterprise AI Voice Agent & Chatbot Website Integration</option>
                    </select><br/><br/>
                    <input type="submit" value="Subscribe">
                </form>
            </aside>
        </div>
        </div>
        <footer style="background-color: #f2f2f2; padding: 20px; border: 1px solid #060606; text-align: center;">
            <div>
                <p>&copy; 2026 TalentLyncAI. All rights reserved.</p>
            </div>
        </footer>
    </body>
</html>
