<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
    <main class="login-container">
        <img src="../images/yt_logo.png" class="login-logo" alt="YouTube Logo">
        <h1>Welcome to YouTube</h1>
        <h2>Please Login to Your Account</h2>
        <p class="required-note">
            <span class="required">*</span>Required fields
        </p>
        <form action="index.html" method="post">
            <div class="form-group">
                <label for="username">
                    Username <span class="required">*</span></label>
                <input id="username" name="username" type="text" placeholder="Username" minlength="3" maxlength="20"
                    pattern="[A-Za-z0-9_]+" title="Username can contain letters, numbers and underscores only"
                    autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">
                    Password <span class="required">*</span></label>
                <input type="password" id="password" name="password" placeholder="Password" minlength="8" maxlength="30"
                    autocomplete="current-password" required>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Remember Me</label>
            </div>
            <button type="submit">Login</button>
        </form>
        <p>
            Forgot your password?
            <a href="#">Set new password</a>
        </p>
        <p>
            <a href="index.html">Go to YouTube</a>

            |

            <a href="https://music.youtube.com/" target="_blank">Go to YouTube Music</a>
        </p>
        <p>
            Don't have an account?
            <a href="../UsingAI/register.html">Register Now</a>
        </p>
    </main>
</body>

</html>
