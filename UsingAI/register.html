<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="register-page">
    <main class="register-container">
        <h1>Welcome to YouTube</h1>
        <h2>Please Register Here</h2>
        <p class="required-note">
            <span class="required">*</span>Required fields
        </p>
        <form id="register" name="regForm" action="#" method="post">
            <div class="form-group">
                <label for="name">
                    Name <span class="required">*</span></label>
                <input id="name" name="name" type="text" placeholder="Name" minlength="2" maxlength="50"
                    autocomplete="name" required>
            </div>
            <div class="form-group">
                <label for="email">
                    Email <span class="required">*</span></label>
                <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="contact">
                    Contact <span class="required">*</span></label>
                <input id="contact" name="contact" type="tel" placeholder="10-digit contact number" minlength="10"
                    maxlength="10" pattern="[0-9]{10}" title="Please enter exactly 10 digits" autocomplete="tel"
                    required>
            </div>
            <div class="form-group">
                <label for="username">
                    Username <span class="required">*</span></label>
                <input id="username" name="username" type="text" placeholder="Username" minlength="3" maxlength="20"
                    pattern="[A-Za-z0-9_]+" title="Username can contain letters, numbers and underscores only"
                    autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">
                    Password <span class="required">*</span></label>
                <input id="password" name="password" type="password" placeholder="Password" minlength="8" maxlength="30"
                    autocomplete="new-password" required>
                <small>Password must contain at least 8 characters.</small>
            </div>
            <div class="form-group">
                <label for="confirmPassword">
                    Confirm Password <span class="required">*</span></label>
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password"
                    minlength="8" maxlength="30" autocomplete="new-password" required>
            </div>
            <fieldset>
                <legend>
                    Gender <span class="required">*</span></legend>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </fieldset>
            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Remember Me</label>
            </div>
            <button type="submit">Register</button>
        </form>
        <p>
            Already have an account?
            <a href="../UsingAI/login.html">Login Here</a>
        </p>
    </main>
</body>

</html>
